name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/build-release.sh

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: lantally-${{ github.ref_name }}.spdx.json
          output-file: dist/release/lantally.spdx.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          {
            echo "### Quick Start"
            echo ""
            echo '```bash'
            echo "docker run -d --name lantally -p 8080:8080 -v lantally:/var/lib/lantally ${IMAGE}"
            echo '```'
            echo ""
            echo 'Open `http://<host>:8080`, set the admin password, and connect a local/LAN Clash or Mihomo controller via **Direct Collectors** (agentless) or deploy a lightweight **Agent** with a one-time claim code.'
            echo ""
            echo "- Public deployments must sit behind an HTTPS reverse proxy."
            echo '- Ingest `protocol_version` remains `1` (backward-compatible with v0.1 agents).'
          } > /tmp/release-notes.md
          gh release create "${RELEASE_TAG}" dist/release/* \
            --title "LanTally ${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes
