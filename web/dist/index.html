<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LanTally</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login-screen" class="login-layout hidden" aria-hidden="true">
      <aside class="login-aside">
        <div class="login-aside-inner">
          <p class="login-kicker">自托管 · 只读 · 不改网</p>
          <h1>把家里各处的流量，收成一本账。</h1>
          <p class="login-lead">
            网关和代理上的 agent 定期上报，LanTally 在本地记录直连、代理和倍率估算，方便你对账和排查。
          </p>
          <ul class="login-points">
            <li>数据留在你的 NAS / 容器里</li>
            <li>不接管 DHCP、不碰防火墙</li>
            <li>一个端口，内置网页</li>
          </ul>
        </div>
        <div class="login-grid" aria-hidden="true"></div>
      </aside>
      <main class="login-main">
        <form id="login-form" class="login-form">
          <div class="login-form-head">
            <span class="logo-mark">LT</span>
            <div>
              <strong>LanTally</strong>
              <span>登录控制台</span>
            </div>
          </div>
          <label for="login-password">管理员密码</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="首次启动见容器日志"
            required
          />
          <p id="login-error" class="field-error hidden" role="alert"></p>
          <button type="submit" class="btn btn-primary">进入</button>
        </form>
      </main>
    </div>

    <div id="app-shell" class="app hidden" aria-hidden="true">
      <header class="app-header">
        <div class="header-left">
          <span class="logo-mark sm">LT</span>
          <span class="logo-text">LanTally</span>
        </div>
        <nav class="header-nav" aria-label="主导航">
          <a href="#overview" data-route="overview" class="nav-item active">概览</a>
          <a href="#nodes" data-route="nodes" class="nav-item">节点</a>
          <a href="#devices" data-route="devices" class="nav-item">设备</a>
          <a href="#proxy" data-route="proxy" class="nav-item">代理</a>
          <a href="#alerts" data-route="alerts" class="nav-item">告警</a>
        </nav>
        <div class="header-right">
          <button type="button" id="refresh-btn" class="btn btn-text">刷新</button>
          <button type="button" id="logout-btn" class="btn btn-text muted">退出</button>
        </div>
      </header>

      <main class="app-main">
        <header class="page-header">
          <div>
            <p class="page-kicker" id="page-eyebrow">Dashboard</p>
            <h2 id="page-title">概览</h2>
          </div>
        </header>

        <section id="view-overview" class="page view active" data-view="overview">
          <div class="metrics" id="overview-stats"></div>
          <div class="card">
            <div class="card-header">
              <h3>账本维度</h3>
            </div>
            <div id="ledger-tags" class="chip-list"></div>
          </div>
        </section>

        <section id="view-nodes" class="page view" data-view="nodes">
          <div class="card">
            <div class="card-header">
              <div>
                <h3>上报节点</h3>
                <p class="card-sub">在网关或旁路由部署 agent 后出现在此</p>
              </div>
              <button type="button" id="enroll-open-btn" class="btn btn-primary btn-sm">注册节点</button>
            </div>
            <div id="nodes-table-wrap"></div>
          </div>
        </section>

        <section id="view-devices" class="page view" data-view="devices">
          <div id="devices-content"></div>
        </section>

        <section id="view-proxy" class="page view" data-view="proxy">
          <div id="proxy-content"></div>
        </section>

        <section id="view-alerts" class="page view" data-view="alerts">
          <div id="alerts-content"></div>
        </section>
      </main>
    </div>

    <dialog id="enroll-dialog" class="modal">
      <form id="enroll-form" method="dialog">
        <div class="modal-header">
          <h3>注册节点</h3>
          <button type="button" id="enroll-cancel-btn" class="btn-icon" aria-label="关闭">×</button>
        </div>
        <p class="modal-lead">生成 agent 凭据。Token 明文只显示一次，请立即保存。</p>
        <div class="field-row">
          <div class="field">
            <label for="enroll-site">站点 ID</label>
            <input id="enroll-site" name="site_id" required placeholder="home" />
          </div>
          <div class="field">
            <label for="enroll-node">节点 ID</label>
            <input id="enroll-node" name="node_id" required placeholder="proxy-20" />
          </div>
        </div>
        <p id="enroll-error" class="field-error hidden" role="alert"></p>
        <div id="enroll-result" class="token-panel hidden">
          <label>Agent Token</label>
          <div class="token-row">
            <code id="enroll-token"></code>
            <button type="button" id="copy-token-btn" class="btn btn-secondary btn-sm">复制</button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="enroll-submit-btn" class="btn btn-primary">生成 Token</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
